[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "randomness-transformer-lab"
version = "0.1.0"
description = "Compact Transformer research toolkit for binary randomness analysis"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "scikit-learn>=1.3", "torch>=2.1"]

[tool.setuptools.packages.find]
include = ["randomness_lab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
